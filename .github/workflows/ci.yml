name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[ai,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Run it through a pipe
        shell: bash  # Git Bash on Windows: stdout is a pipe with the legacy code page
        run: |
          python scripts/demo_repos.py "$RUNNER_TEMP/demo" --days 30
          devpulse week "$RUNNER_TEMP/demo" --md "$RUNNER_TEMP/out" --html "$RUNNER_TEMP/out" | cat
          devpulse standup "$RUNNER_TEMP/demo" | cat

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/devpulse --version
          python scripts/demo_repos.py /tmp/demo --days 60
          /tmp/clean/bin/devpulse week /tmp/demo --md /tmp/out --html /tmp/out
          /tmp/clean/bin/devpulse standup /tmp/demo
          ls /tmp/out/*.md /tmp/out/*.html
