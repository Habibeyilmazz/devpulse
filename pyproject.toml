[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devpulse"
version = "0.1.0"
description = "Your personal engineering weekly review, generated from local git history."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Habibeyilmazz" }]
keywords = ["git", "productivity", "weekly-review", "obsidian", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["rich>=13", "tomli>=1.1; python_version < \"3.11\""]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff==0.17.6", "build>=1"]

[project.scripts]
devpulse = "devpulse.cli:main"

[project.urls]
Homepage = "https://github.com/Habibeyilmazz/devpulse"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the HTML templates carry long literal lines
